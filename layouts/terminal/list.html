{{- $bp := (urls.Parse site.BaseURL).Path | strings.TrimSuffix "/" -}}

    <p style="color: #adaaaa; margin-bottom: 2rem;">
      This page requires JavaScript. It is the dev-mode terminal for Nadec Biju's Fab Academy 2026 portfolio.
    </p>
    <a href="{{ $bp }}/" style="display: inline-block; padding: 10px 20px; background: #79b0ff; color: #002e5c; text-decoration: none; border-radius: 6px; font-weight: bold;">

    </a>
  </div>
</noscript>
<style>
  /* ══════════════ Terminal shell (now a window on the desktop) ══════════════ */
  #screen {
    position: fixed; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid #2e2e2e; border-radius: 12px; pointer-events: auto;
    box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 0 1px rgba(121,176,255,0.05);
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(121,176,255,0.06), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(234,115,251,0.05), transparent 55%),
      var(--bg);
  }
  #screen.maxed, #screen.snapped { border-radius: 0; }
  #screen[hidden] { display: none; }
  /* subtle scanline + flicker for CRT vibe (very light) */
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay; opacity: 0.5;
  }

  /* top status bar */
  #statusbar {
    height: 38px; flex: 0 0 38px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px; background: rgba(16,16,16,0.92); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px); position: relative; z-index: 5; user-select: none;
    cursor: grab; touch-action: none;
  }
  #statusbar:active { cursor: grabbing; }
  .traffic { display: flex; gap: 10px; }
  .traffic span {
    width: 14px; height: 14px; border-radius: 50%; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; transition: filter 0.12s;
  }
  /* invisible enlarged hit area so the dots are easy to click */
  .traffic span::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  .traffic span:hover { filter: brightness(1.15); }
  .traffic span::after { font-size: 9px; font-weight: 800; color: rgba(0,0,0,0.55); opacity: 0; line-height: 1; }
  .traffic:hover .t-red::after { content: "✕"; opacity: 1; }
  .traffic:hover .t-yel::after { content: "−"; opacity: 1; }
  .traffic:hover .t-grn::after { content: "↕"; opacity: 1; }
  .t-red { background: #ff5f57; } .t-yel { background: #febc2e; } .t-grn { background: #28c840; }
  #statusbar .title { color: var(--dim); font-size: 12px; flex: 1; text-align: center; letter-spacing: 0.5px; }
  #statusbar .title b { color: var(--fg); font-weight: 500; }
  .gui-btn {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px;
    font-weight: 700; color: #fff;
    background: linear-gradient(90deg, #79b0ff, #ea73fb, #ffac54, #79b0ff);
    background-size: 300% 100%;
    border: none;
    border-radius: 7px; padding: 6px 14px; cursor: pointer; transition: all 0.2s ease;
    animation: guiBtnGlow 4s linear infinite;
    box-shadow: 0 0 12px rgba(234,115,251,0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .gui-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(234,115,251,0.6); }
  @keyframes guiBtnGlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
  .gui-btn .material-symbols-outlined { font-size: 16px; }

  /* scrollback */
  #scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 22px;
    position: relative; z-index: 3; scroll-behavior: smooth;
  }
  #output { white-space: pre-wrap; word-break: break-word; }
  #output .row { padding: 1px 0; }
  #output .blk { margin: 2px 0 10px; }

  /* color classes */
  .c-green { color: var(--green); } .c-blue { color: var(--blue); } .c-purple { color: var(--purple); }
  .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-cyan { color: var(--cyan); }
  .c-dim { color: var(--dim); } .c-fg { color: var(--fg); } .b { font-weight: 700; }
  .banner { color: var(--blue); line-height: 1.1; font-size: 13px; }
  @media (max-width: 520px) { .banner { font-size: 8px; } }

  /* clickable fs entries */
  .fsentry { cursor: pointer; border-radius: 4px; padding: 0 3px; transition: background 0.12s; }
  .fsentry:hover { background: rgba(255,255,255,0.07); text-decoration: underline; }

  /* input line */
  #inputline { display: flex; align-items: baseline; gap: 8px; padding: 2px 0 4px; }
  #prompt { white-space: nowrap; flex: 0 0 auto; }
  #cmd {
    flex: 1 1 auto; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--fg); font-family: var(--mono); font-size: 14px; caret-color: var(--green); padding: 0;
  }
  .prompt-user { color: var(--green); } .prompt-host { color: var(--green); }
  .prompt-path { color: var(--blue); } .prompt-tail { color: var(--fg); }

  /* ══════════════ Windows ══════════════ */
  /* Holds the terminal window + all file windows so they share one stacking order,
     while clicks on empty space fall through to the desktop behind. */
  #windows { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
  #windows > * { pointer-events: auto; }
  .win {
    position: absolute; pointer-events: auto; display: flex; flex-direction: column;
    background: #0d0d0d; border: 1px solid #333; border-radius: 12px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(121,176,255,0.06);
    min-width: 280px; min-height: 160px;
    animation: winpop 0.16s ease;
  }
  @keyframes winpop { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: none; } }
  .win.maxed { border-radius: 0; }
  .win-bar {
    flex: 0 0 auto; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: linear-gradient(180deg, #1a1a1a, #141414); border-bottom: 1px solid #2a2a2a;
    cursor: grab; user-select: none; touch-action: none;
  }
  .win-bar:active { cursor: grabbing; }
  .win-dots { display: flex; gap: 7px; }
  .win-dots span { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
  .win-title {
    flex: 1; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; display: flex; align-items: center; gap: 7px;
  }
  .win-title .material-symbols-outlined { font-size: 15px; color: var(--blue); }
  .win-title b { color: #e8e8e8; font-weight: 500; }
  .win-body { flex: 1; overflow: auto; padding: 26px 30px 34px; background: #0e0e0e; -webkit-overflow-scrolling: touch; }
  .win-body .prose-neon { max-width: 760px; margin: 0 auto; }
  .win-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--dim); font-family: var(--mono); }
  .spinner { width: 30px; height: 30px; border: 3px solid #262626; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .win-resize {
    position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize;
    touch-action: none; z-index: 3;
    background: linear-gradient(135deg, transparent 50%, #3a3a3a 50%, #3a3a3a 60%, transparent 60%, transparent 72%, #3a3a3a 72%, #3a3a3a 82%, transparent 82%);
  }
  .win-open-src {
    color: var(--dim); cursor: pointer; font-size: 16px; padding: 2px; border-radius: 5px; transition: color 0.15s;
  }
  .win-open-src:hover { color: var(--blue); }

  /* snap preview (Windows-style drop zone) */
  #snap-preview {
    position: fixed; z-index: 90; pointer-events: none; opacity: 0; border-radius: 14px;
    border: 2px solid rgba(121,176,255,0.9); background: rgba(121,176,255,0.16);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.35), 0 20px 60px rgba(121,176,255,0.22);
    transition: opacity 0.12s ease, left 0.12s ease, top 0.12s ease, width 0.12s ease, height 0.12s ease;
  }
  #snap-preview.show { opacity: 1; }

  /* ══════════════ Mobile command bar ══════════════ */
  #mobilebar {
    flex: 0 0 auto; display: none; gap: 7px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(16,16,16,0.96); border-top: 1px solid var(--line); overflow-x: auto;
    position: relative; z-index: 6; -webkit-overflow-scrolling: touch;
  }
  #mobilebar::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-family: var(--mono); font-size: 13px; color: var(--fg);
    background: #1c1c1c; border: 1px solid #333; border-radius: 9px; padding: 9px 14px; cursor: pointer;
    white-space: nowrap; user-select: none;
  }
  .chip:active { background: #2a2a2a; }
  .chip.key { color: var(--green); border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.08); }
  .chip .material-symbols-outlined { font-size: 16px; }
  @media (max-width: 820px), (pointer: coarse) { #mobilebar { display: flex; } }

  /* ══════════════ macOS-style desktop (always-on base layer) ══════════════ */
  #desktop { position: fixed; inset: 0; z-index: 10; background: #05060a; overflow: hidden; }
  #wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.6; }
  #desktop::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(1200px 700px at 50% 28%, rgba(121,176,255,0.12), transparent 60%),
      radial-gradient(900px 600px at 82% 92%, rgba(234,115,251,0.10), transparent 55%),
      linear-gradient(180deg, rgba(5,6,10,0.25), rgba(5,6,10,0.78));
  }
  #menubar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 4000; height: 28px; display: flex; align-items: center; gap: 18px;
    padding: 0 16px; background: rgba(10,10,12,0.5); backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid rgba(255,255,255,0.07); color: #e8e8e8; font-family: Inter, sans-serif; font-size: 13px; user-select: none;
  }
  #menubar .mb-logo { font-size: 11px; color: var(--green); }
  #menubar .mb-app { font-weight: 700; }
  #menubar .mb-item { color: rgba(255,255,255,0.7); }
  #menubar .spacer { flex: 1; }
  #menubar .mb-clock { font-variant-numeric: tabular-nums; color: #fff; }
  #clock {
    position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; user-select: none;
    transition: left 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
  }
  #clock.hidden { opacity: 0; }
  .clock-time {
    font-family: "Plus Jakarta Sans", Inter, sans-serif; font-weight: 700; line-height: 1;
    font-size: clamp(46px, 9vw, 120px); color: #fff; letter-spacing: -0.04em;
    text-shadow: 0 10px 50px rgba(0,0,0,0.55); font-variant-numeric: tabular-nums;
  }
  .clock-date { margin-top: 12px; font-family: Inter, sans-serif; font-weight: 500; color: rgba(255,255,255,0.78); font-size: clamp(13px, 2vw, 20px); letter-spacing: 0.02em; }
  #dock {
    position: fixed; z-index: 4000; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 14px; padding: 10px 14px;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16); border-radius: 22px;
    backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .dock-sep { width: 1px; align-self: stretch; margin: 6px 2px; background: rgba(255,255,255,0.16); }
  .dock-app {
    width: 60px; height: 60px; border-radius: 16px; border: none; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
  }
  .dock-app:hover { transform: translateY(-14px) scale(1.14); z-index: 10; }
  .dock-app.docs { background: linear-gradient(160deg, #1b2740, #0d1422); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }
  .dock-app.docs img { width: 40px; height: 40px; object-fit: contain; }
  .dock-app.term { background: linear-gradient(160deg, #2b2b2b, #0c0c0c); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); }
  .dock-app.term .glyph { font-family: var(--mono); font-weight: 700; font-size: 24px; color: var(--green); }
  .dock-app .tip {
    position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,0.85); color: #fff; font-family: Inter, sans-serif; font-size: 11px;
    padding: 4px 9px; border-radius: 7px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .dock-app:hover .tip { opacity: 1; }
  .dock-app::after { content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.55); }
  /* taskbar chips: one per open window */
  .dock-app.dock-task { width: 50px; height: 50px; background: linear-gradient(160deg, #26303f, #131a24); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); }
  .dock-app.dock-task.minimized { opacity: 0.5; }
  .dock-app.dock-task .material-symbols-outlined { font-size: 24px; color: var(--blue); }
  .dock-app.dock-task::after { background: var(--blue); opacity: 0.9; }
  /* per-window icon (week pages use an image; everything else the markdown logo) */
  .win-ico-slot { display: inline-flex; align-items: center; justify-content: center; }
  .win-title .win-ico-slot { width: 16px; height: 16px; flex: 0 0 16px; }
  .win-title .win-ico { width: 16px; height: 16px; border-radius: 4px; object-fit: cover; display: block; }
  /* clip the icon on the SLOT (not the chip) so the hover tooltip is never cut off */
  .dock-task .win-ico-slot { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; }
  .dock-task .win-ico { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* live info under the clock — iOS Weather-widget style */
  #sysinfo { margin-top: 24px; display: inline-flex; flex-direction: column; gap: 12px; text-align: left; font-family: Inter, sans-serif; }
  #sysinfo:empty { display: none; }
  .wx-card {
    min-width: 312px; border-radius: 22px; padding: 16px 18px 14px; color: #fff;
    background: linear-gradient(165deg, rgba(94,150,222,0.62), rgba(38,66,116,0.62));
    border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 18px 50px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.14);
  }
  .wx-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .wx-loc { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .wx-cond { text-align: right; font-size: 13px; color: #fff; }
  .wx-hl { font-size: 12px; color: rgba(255,255,255,0.78); margin-top: 2px; }
  .wx-temp { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 300; font-size: 52px; line-height: 1.1; letter-spacing: -0.04em; }
  .wx-hours { display: flex; gap: 2px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); }
  .wx-hour { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wx-hour .h-t { font-size: 11px; color: rgba(255,255,255,0.82); }
  .wx-hour .material-symbols-outlined { font-size: 21px; color: #fff; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .wx-hour .h-d { font-size: 13px; font-weight: 600; }
  .si-list {
    display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; border-radius: 18px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px);
  }
  .si-item { display: flex; align-items: center; gap: 11px; font-size: 13.5px; color: rgba(255,255,255,0.85); }
  .si-item .material-symbols-outlined { font-size: 19px; color: var(--blue); flex: 0 0 19px; }
  .si-item .si-v { color: #fff; font-weight: 500; margin-left: auto; }

  /* mobile: lift the dock above the terminal's command bar so they don't collide */
  @media (max-width: 820px), (pointer: coarse) {
    #dock { bottom: calc(64px + env(safe-area-inset-bottom)); gap: 9px; padding: 8px 10px; max-width: 92vw; overflow-x: auto; overflow-y: visible; }
    #dock::-webkit-scrollbar { display: none; }
    .dock-app { width: 46px; height: 46px; }
    .dock-app.dock-task { width: 40px; height: 40px; }
    #sysinfo { font-size: 11px; min-width: 210px; }
  }
</style>

<!-- desktop base layer (always visible behind the windows) -->

  <canvas id="wallpaper"></canvas>
  <div id="clock">
    <div class="clock-time" id="clock-time">--:--</div>
    <div class="clock-date" id="clock-date"></div>
    <div id="sysinfo"></div>
  </div>
</div>

<!-- macOS menu bar -->
<div id="menubar">
  <span class="mb-logo">●</span><span class="mb-app">NadecOS</span>
  <span class="mb-item">File</span><span class="mb-item">Edit</span><span class="mb-item">View</span>
  <span class="spacer"></span>
  <span class="mb-clock" id="mb-clock"></span>
</div>

<!-- window layer: terminal window + file windows (shared stacking order) -->
<div id="windows">
<div id="screen">
  <!-- top bar -->
  <div id="statusbar">
    <div class="traffic">
      <span class="t-red" data-act="close" title="Close to desktop"></span>
      <span class="t-yel" data-act="min"   title="Minimize to desktop"></span>
      <span class="t-grn" data-act="max"   title="Toggle fullscreen"></span>
    </div>
    <div class="title">nadec@fabacademy: <b>~</b> — zsh</div>

      <span class="material-symbols-outlined">desktop_windows</span> Exit to site
    </button>

  <!-- scrollback + input -->
  <div id="scroll">

<div id="snap-preview"></div>

<script>
(function () {
  "use strict";
  var BP = window.NB_BP || "";
  var URUMI_URL = "https://nb6rules.github.io/Urumi-Vision-Web/";   // external tool, opens in a new tab
  var LINKAGE_URL = "https://nb6rules.github.io/Linkage-Designer/"; // external tool, opens in a new tab
  var $ = function (s, r) { return (r || document).querySelector(s); };

  var output  = $("#output");
  var scroll  = $("#scroll");
  var input   = $("#cmd");
  var promptEl= $("#prompt");
  var winLayer= $("#windows");
  var dockEl  = $("#dock");
  var preview = $("#snap-preview");

  // ─────────────────────────── Virtual filesystem ───────────────────────────
  var ROOT = { name: "~", title: "home", url: BP + "/", children: new Map() };
  var cwd = [];                    // array of segment names from root
  var ready = false;

  function ensureChild(parent, seg) {
    if (!parent.children.has(seg)) parent.children.set(seg, { name: seg, title: null, url: null, summary: "", children: new Map() });
    return parent.children.get(seg);
  }
  function nodeAt(segs) { var n = ROOT; for (var i = 0; i < segs.length; i++) { n = n.children.get(segs[i]); if (!n) return null; } return n; }
  function isDir(node) { return node && node.children.size > 0; }

  // natural compare so week-2 < week-10, dirs before files
  function naturalCmp(a, b) {
    return a.replace(/\d+/g, function (m) { return m.padStart(8, "0"); })
      .localeCompare(b.replace(/\d+/g, function (m) { return m.padStart(8, "0"); }));
  }
  function sortedChildren(node) {
    var arr = Array.from(node.children.values());
    arr.sort(function (x, y) {
      var dx = isDir(x), dy = isDir(y);
      if (dx !== dy) return dx ? -1 : 1;
      return naturalCmp(x.name, y.name);
    });
    return arr;
  }

  function buildFS(data) {
    data.forEach(function (item) {
      var rel = item.url || "";
      if (BP && rel.indexOf(BP) === 0) rel = rel.slice(BP.length);
      var segs = rel.split("/").filter(Boolean);
      if (!segs.length) return;                 // home page
      if (segs[0] === "terminal") return;       // hide the terminal itself
      var node = ROOT;

  // path resolver: supports / ~ . .. relative + absolute
  function resolve(path) {
    if (!path || path === "." ) return { node: nodeAt(cwd), segs: cwd.slice() };
    var working;
    if (path === "/" || path === "~") return { node: ROOT, segs: [] };
    if (path.charAt(0) === "/") { working = []; path = path.slice(1); }
    else if (path.indexOf("~/") === 0) { working = []; path = path.slice(2); }
    else working = cwd.slice();
    var parts = path.split("/").filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p === ".") continue;
      if (p === "..") { working.pop(); continue; }
      var here = nodeAt(working);
      if (!here || !here.children.has(p)) return null;
      working.push(p);
    }
    return { node: nodeAt(working), segs: working };
  }

  // ─────────────────────────── Executor ───────────────────────────
  function run(raw) {
    var line = raw.trim();
    if (line) { history.push(line); if (history.length > 200) history.shift(); }
    hi = history.length;
    echoCommand(line);
    if (!line) return;
    var parts = line.split(/\s+/);
    var cmd = parts[0].toLowerCase();
    var args = parts.slice(1);
    if (COMMANDS[cmd]) { try { COMMANDS[cmd](args); } catch (e) { print('<span class="c-red">error: ' + esc(e.message) + "</span>"); } }
    else print('<span class="c-red">command not found: ' + esc(cmd) + '</span> <span class="c-dim">— type </span><span class="c-cyan">help</span>');
  }

  // ─────────────────────────── Tab completion ───────────────────────────
  function complete() {
    var val = input.value;
    var sp = val.lastIndexOf(" ");
    var head = sp === -1 ? "" : val.slice(0, sp + 1);
    var token = sp === -1 ? val : val.slice(sp + 1);
    // split token into dir part + base part
    var slash = token.lastIndexOf("/");
    var dirPart = slash === -1 ? "" : token.slice(0, slash + 1);
    var base = slash === -1 ? token : token.slice(slash + 1);
    var ctx = resolve(dirPart || ".");
    if (!ctx || !ctx.node) return;
    var matches = sortedChildren(ctx.node).filter(function (k) { return k.name.indexOf(base) === 0; });
    if (sp === -1) { // completing the command itself
      var cmds = Object.keys(COMMANDS).filter(function (c) { return c.indexOf(token) === 0; });
      if (cmds.length === 1) { input.value = cmds[0] + " "; return; }
      if (cmds.length > 1) { print(cmds.map(function (c) { return '<span class="c-cyan">' + c + "</span>"; }).join("   ")); return; }
    }
    if (!matches.length) return;
    if (matches.length === 1) {
      var m = matches[0];
      input.value = head + dirPart + m.name + (isDir(m) ? "/" : " ");
    } else {
      // common prefix fill + list
      var cp = matches[0].name;
      matches.forEach(function (m) { while (m.name.indexOf(cp) !== 0) cp = cp.slice(0, -1); });
      input.value = head + dirPart + cp;
      print(matches.map(function (m) { return (isDir(m) ? '<span class="c-blue b">' + esc(m.name) + "/</span>" : '<span class="c-cyan">' + esc(m.name) + "</span>"); }).join("   "));
    }
  }

  // ─────────────────────────── Window manager ───────────────────────────
  var zTop = 100, winN = 0;

  // ── snap geometry (Windows-style) ──
  function rectFor(zone) {
    var a = workArea();
    switch (zone) {
      case "max":   return { x: a.x, y: a.y, w: a.w, h: a.h };
      case "left":  return { x: a.x, y: a.y, w: a.w / 2, h: a.h };
      case "right": return { x: a.x + a.w / 2, y: a.y, w: a.w / 2, h: a.h };
      case "tl":    return { x: a.x, y: a.y, w: a.w / 2, h: a.h / 2 };
      case "tr":    return { x: a.x + a.w / 2, y: a.y, w: a.w / 2, h: a.h / 2 };
      case "bl":    return { x: a.x, y: a.y + a.h / 2, w: a.w / 2, h: a.h / 2 };
      case "br":    return { x: a.x + a.w / 2, y: a.y + a.h / 2, w: a.w / 2, h: a.h / 2 };
    }
    return null;
  }
  function snapZone(x, y) {
    var W = window.innerWidth, H = window.innerHeight, top = workArea().y, E = 28, C = 110;
    var nl = x <= C, nr = x >= W - C, nt = y <= top + C, nb = y >= H - C;       // near corners
    if (nt && nl) return "tl"; if (nt && nr) return "tr";
    if (nb && nl) return "bl"; if (nb && nr) return "br";
    if (y <= top + E) return "max";                                            // top edge → maximize
    if (x <= E) return "left"; if (x >= W - E) return "right";                  // side edges → halves
    return null;
  }
  function applyRect(w, r, animate) {
    if (!r) return;
    w.style.transition = animate ? "left .16s ease, top .16s ease, width .16s ease, height .16s ease" : "none";
    w.style.left = Math.round(r.x) + "px"; w.style.top = Math.round(r.y) + "px";
    w.style.width = Math.round(r.w) + "px"; w.style.height = Math.round(r.h) + "px";
    if (animate) setTimeout(function () { w.style.transition = "none"; }, 180);
    updateClockPosition();
  }
  function showPreview(zone) {
    if (!zone) { preview.classList.remove("show"); return; }
    var r = rectFor(zone);
    preview.style.left = r.x + "px"; preview.style.top = r.y + "px";
    preview.style.width = r.w + "px"; preview.style.height = r.h + "px";

  function rememberFloat(w) {
    if (w.classList.contains("snapped") || w.classList.contains("maxed")) return;

  }

    var r = w.getBoundingClientRect(), a = workArea();

  }

  function makeDraggable(w, handle) {
    handle.addEventListener("pointerdown", function (e) {

      if (e.button != null && e.button !== 0) return;
      bringToFront(w);
      var r = w.getBoundingClientRect(), ox, oy;
      if (w.classList.contains("snapped") || w.classList.contains("maxed")) {
        var f = w._float || { width: Math.min(860, window.innerWidth * 0.6), height: Math.min(660, window.innerHeight * 0.72) };
        ox = f.width * ((e.clientX - r.left) / r.width); oy = Math.min(20, e.clientY - r.top);
        w.classList.remove("snapped", "maxed"); w.style.width = f.width + "px"; w.style.height = f.height + "px";
      } else { rememberFloat(w); ox = e.clientX - r.left; oy = e.clientY - r.top; }
      handle.setPointerCapture(e.pointerId);
      w.style.transition = "none";
      var zone = null;
      function mv(ev) {
        w.style.left = (ev.clientX - ox) + "px";
        w.style.top  = Math.max(workArea().y, ev.clientY - oy) + "px";
        zone = snapZone(ev.clientX, ev.clientY); showPreview(zone);
        updateClockPosition();

        if (zone) { applyRect(w, rectFor(zone), true); w.classList.add(zone === "max" ? "maxed" : "snapped"); }

        '<div class="win-dots">' +
          '<span style="background:#ff5f57" data-act="close"></span>' +
          '<span style="background:#febc2e" data-act="min"></span>' +
          '<span style="background:#28c840" data-act="max"></span>' +
        '</div>' +
        '<div class="win-title"><span class="win-ico-slot"><span class="material-symbols-outlined">description</span></span><b>' + esc(title) + "</b></div>" +
        '<span class="material-symbols-outlined win-open-src" data-act="src" title="Open the real page in a new tab">open_in_new</span>' +
      "</div>" +
      '<div class="win-body"><div class="win-loading"><div class="spinner"></div><span>fetching ' + esc(title) + "…</span></div></div>" +
      '<div class="win-resize"></div>';

    winLayer.appendChild(w);
    var bar = $(".win-bar", w), body = $(".win-body", w), handle = $(".win-resize", w);
    w.addEventListener("pointerdown", function () { bringToFront(w); }, true);
    bar.addEventListener("click", function (e) {
      var act = e.target.getAttribute("data-act");
      if (act === "close") closeWin(w);
      else if (act === "min") minimizeWin(w);
      else if (act === "max") toggleMax(w);
      else if (act === "src") window.open(url, "_blank", "noopener");
    });
    bar.addEventListener("dblclick", function (e) { if (!e.target.getAttribute("data-act")) toggleMax(w); });
    makeDraggable(w, bar); makeResizable(w, handle);
    addTaskChip(w, title);            // show in the taskbar immediately
    if (w._isWeek) resolveWeekIcon(w);
    updateClockPosition();
    loadContent(body, url);
  }
  function iconHTML(w) {
    return w && w._iconSrc
      ? '<img class="win-ico" src="' + esc(w._iconSrc) + '" alt="">'
      : '<span class="material-symbols-outlined">description</span>';
  }
  function setWinIcon(w, src) {
    w._iconSrc = src || null;
    var t = w.querySelector(".win-title .win-ico-slot"); if (t) t.innerHTML = iconHTML(w);
    if (w._chip) { var c = w._chip.querySelector(".win-ico-slot"); if (c) c.innerHTML = iconHTML(w); }
  }
  // week pages → week-N.jpg (week-7 is week-07.jpg); project-development → week-20 image; else markdown logo
  function resolveWeekIcon(w) {
    var cands = w._iconCands || [];
    (function tryNext(i) {
      if (i >= cands.length) return;                 // none found → keep the markdown logo
      var img = new Image();
      img.onload = function () { setWinIcon(w, cands[i]); };
      img.onerror = function () { tryNext(i + 1); };
      img.src = cands[i];
    })(0);
  }

  // ── taskbar: one chip per open window, shown the instant it opens ──
  var taskSep = null;
  function addTaskChip(w, title) {
    if (!taskSep) { taskSep = document.createElement("div"); taskSep.className = "dock-sep"; dockEl.appendChild(taskSep); }
    var chip = document.createElement("button");
    chip.className = "dock-app dock-task";
    chip.innerHTML = '<span class="tip">' + esc(title) + '</span><span class="win-ico-slot">' + iconHTML(w) + '</span>';
    chip.addEventListener("click", function () { if (w.style.display === "none") restoreWin(w); else minimizeWin(w); });
    w._chip = chip; dockEl.appendChild(chip);
  }
  function removeTaskChip(w) {
    if (w._chip) { w._chip.remove(); w._chip = null; }
    if (taskSep && !dockEl.querySelector(".dock-task")) { taskSep.remove(); taskSep = null; }
  }
  function minimizeWin(w) { w.style.display = "none"; if (w._chip) w._chip.classList.add("minimized"); updateClockPosition(); }
  function restoreWin(w) { w.style.display = ""; if (w._chip) w._chip.classList.remove("minimized"); bringToFront(w); updateClockPosition(); }
  function closeWin(w) { removeTaskChip(w); w.remove(); updateClockPosition(); }

  function loadContent(body, url) {
    fetch(url).then(function (r) { return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      var content = doc.querySelector(".prose-neon") || doc.querySelector("main") || doc.body;
      var pageURL = new URL(url, location.origin).href;
      // make every relative src/href absolute so images & links resolve
      content.querySelectorAll("[src],[href]").forEach(function (el) {
        ["src", "href"].forEach(function (attr) {
          var v = el.getAttribute(attr);
          if (!v || /^(https?:|mailto:|tel:|data:|#|\/\/)/i.test(v)) return;
          try { el.setAttribute(attr, new URL(v, pageURL).href); } catch (e) {}
        });
      });
      var wrap = document.createElement("div");
      wrap.className = "prose-neon";
      wrap.innerHTML = content.innerHTML;
      // internal links → open a new window; external → new tab
      wrap.querySelectorAll("a[href]").forEach(function (a) {
        var href = a.getAttribute("href");
        if (!href) return;
        var u; try { u = new URL(href, location.origin); } catch (e) { return; }
        if (u.origin === location.origin && !/\.(pdf|zip|rar|png|jpe?g|gif|svg|mp4|bat|stl|step|f3d)$/i.test(u.pathname)) {
          a.addEventListener("click", function (ev) { ev.preventDefault(); openWindowURL(u.pathname, (a.textContent || "page").trim().slice(0, 40)); });
        } else { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); }
      });
      body.innerHTML = "";
      body.appendChild(wrap);
      // re-run scripts inside the content so interactive widgets (calculators, games) work in-window
      wrap.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    }).catch(function () {
      body.innerHTML = '<div class="win-loading"><span style="color:var(--red)">failed to load this page.</span></div>';
    });
  }

  // ─────────────────────────── Exit to normal site ───────────────────────────
  function leaveToSite() {
    // sessionStorage, not localStorage: the "exit" choice lasts only for this
    // browsing session, so the terminal greets visitors again on their next visit.
    try { sessionStorage.setItem("nb-view", "gui"); localStorage.removeItem("nb-view"); } catch (e) {}
    location.href = BP + "/";
  }
  $("#exit-btn").addEventListener("click", leaveToSite);

  // ─────────────────────────── Input wiring ───────────────────────────
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var v = input.value; input.value = ""; run(v); }
    else if (e.key === "Tab") { e.preventDefault(); complete(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (hi > 0) { hi--; input.value = history[hi] || ""; moveCaretEnd(); } }
    else if (e.key === "ArrowDown") { e.preventDefault(); if (hi < history.length - 1) { hi++; input.value = history[hi] || ""; } else { hi = history.length; input.value = ""; } }
    else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); output.innerHTML = ""; }
  });
  function moveCaretEnd() { requestAnimationFrame(function () { input.setSelectionRange(input.value.length, input.value.length); }); }

  // click anywhere on the scrollback → focus input (but allow text selection & link clicks)
  scroll.addEventListener("click", function (e) {
    var cmd = e.target.closest("[data-cmd]");
    if (cmd) { var c = cmd.getAttribute("data-cmd"); input.value = ""; run(c); focusInput(); return; }
    if (window.getSelection && String(window.getSelection())) return;
    focusInput();
  });
  function focusInput() { input.focus({ preventScroll: false }); snap(); }

  // mobile bar
  $("#mobilebar").addEventListener("click", function (e) {
    var btn = e.target.closest("button"); if (!btn) return;
    if (btn.hasAttribute("data-key")) { focusInput(); return; }
    var ins = btn.getAttribute("data-insert");
    if (ins != null) { input.value = ins; focusInput(); moveCaretEnd(); return; }
    var r = btn.getAttribute("data-run");
    if (r != null) { run(r); focusInput(); }
  });

  // ─────────────────────────── Boot ───────────────────────────
  renderPrompt();
  print(
    '<span class="banner">' +
    "███╗   ██╗ █████╗ ██████╗ ███████╗ ██████╗\n" +
    "████╗  ██║██╔══██╗██╔══██╗██╔════╝██╔════╝\n" +
    "██╔██╗ ██║███████║██║  ██║█████╗  ██║     \n" +
    "██║╚██╗██║██╔══██║██║  ██║██╔══╝  ██║     \n" +
    "██║ ╚████║██║  ██║██████╔╝███████╗╚██████╗\n" +
    "╚═╝  ╚═══╝╚═╝  ╚═╝╚═════╝ ╚══════╝ ╚═════╝</span>"
  );
  print('<span class="c-dim">Nadec Biju · Fab Academy 2026 · Kochi — </span><span class="c-green">interactive terminal v1.0</span>');

  fetch(BP + "/index.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      buildFS(data);
      remapTools();
      cwd = nodeAt(["docs"]) ? ["docs"] : [];   // start inside ~/docs by default
      renderPrompt();
      ready = true;
      print(
        '<span class="c-dim">Filesystem mounted. </span><span class="c-cyan">' + data.length + '</span><span class="c-dim"> pages indexed.</span>\n' +
        'Type <span class="c-cyan">help</span> for commands, <span class="c-cyan">ls</span> to look around, or <span class="c-cyan">neofetch</span> for the vibes.\n' +
        '<span class="c-dim">Not a dev? Hit </span><span class="c-blue">Exit to site</span><span class="c-dim"> (top-right) for the normal website.</span>'
      );
      focusInput();
    })
    .catch(function () { print('<span class="c-red">failed to mount filesystem (index.json). reload to retry.</span>'); });

  // ─────────────────────────── Terminal window controls + dock ───────────────────────────
  var screenEl = $("#screen"), statusbar = $("#statusbar"), termResize = $("#term-resize");

  // keep the clock centered in whichever side the front-most window isn't covering (any window, L or R)
  function visibleWins() {
    var arr = [];
    if (!screenEl.hidden && screenEl.style.display !== "none") arr.push(screenEl);
    winLayer.querySelectorAll(".win").forEach(function (w) { if (w.style.display !== "none") arr.push(w); });
    return arr;
  }
  function updateClockPosition() {
    var clk = $("#clock"); if (!clk) return;
    var wins = visibleWins();
    if (!wins.length) { clk.classList.remove("hidden"); clk.style.left = "50%"; return; }
    var ref = wins[0], zmax = -1;                                                   // front-most window
    wins.forEach(function (w) { var z = +(w.style.zIndex || 0); if (z >= zmax) { zmax = z; ref = w; } });
    var r = ref.getBoundingClientRect(), W = window.innerWidth;
    if (r.left <= 6 && r.right >= W - 6) { clk.classList.add("hidden"); return; }    // covers full width
    clk.classList.remove("hidden");
    var cx = (W - r.right) >= r.left ? (r.right + W) / 2 : r.left / 2;               // bigger free side
    clk.style.left = Math.round(cx) + "px";
  }

  function showTerminal() { screenEl.hidden = false; bringToFront(screenEl); document.body.classList.add("term-open"); updateClockPosition(); focusInput(); }
  function hideTerminal() { screenEl.hidden = true; document.body.classList.remove("term-open"); updateClockPosition(); }
  function toggleTerminal() { if (screenEl.hidden) showTerminal(); else { bringToFront(screenEl); focusInput(); } }

  // traffic lights drive the terminal window: red/yellow → desktop, green → maximize
  statusbar.querySelector(".traffic").addEventListener("click", function (e) {
    var s = e.target.closest("[data-act]"); if (!s) return;
    var a = s.getAttribute("data-act");
    if (a === "max") toggleMax(screenEl); else hideTerminal();
  });
  statusbar.addEventListener("dblclick", function (e) {
    if (e.target.closest("[data-act]") || e.target.closest("button")) return;
    toggleMax(screenEl);
  });
  makeDraggable(screenEl, statusbar);
  makeResizable(screenEl, termResize);

  // dock: docs → normal site, terminal → toggle the terminal window
  dockEl.addEventListener("click", function (e) {
    var app = e.target.closest("[data-app]"); if (!app) return;
    if (app.getAttribute("data-app") === "terminal") toggleTerminal();
    else if (app.getAttribute("data-app") === "docs") leaveToSite();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && screenEl.hidden) showTerminal();
  });

  // initial terminal geometry: docked to the side (full-screen on phones)
  function initTerminalWindow() {
    var a = workArea();
    if (window.innerWidth < 760) {
      applyRect(screenEl, rectFor("max"), false); screenEl.classList.add("maxed");
    } else {
      var rect = { x: a.x + 16, y: a.y + 14, w: Math.round(a.w * 0.56), h: Math.round(a.h * 0.9) };
      applyRect(screenEl, rect, false);
      screenEl._float = { left: rect.x, top: rect.y, width: rect.w, height: rect.h };
    }
    bringToFront(screenEl);
    document.body.classList.add("term-open");
    updateClockPosition();
  }
  initTerminalWindow();
  startWallpaper();
  loadSysInfo();
  window.addEventListener("resize", updateClockPosition);

  // live local clock
  function tickClock() {
    var d = new Date();
    var big = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    var full = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
    var date = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    var ct = $("#clock-time"); if (ct) ct.textContent = big;
    var cd = $("#clock-date"); if (cd) cd.textContent = date;
    var mb = $("#mb-clock"); if (mb) mb.textContent = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + "   " + full;
  }
  setInterval(tickClock, 1000); tickClock();

  // ── live info card under the clock (iOS Weather-widget style) ──
  function weatherText(c) {
    if (c === 0) return "Clear"; if (c <= 2) return "Partly Cloudy"; if (c === 3) return "Cloudy";
    if (c <= 48) return "Fog"; if (c <= 57) return "Drizzle"; if (c <= 67) return "Rain";
    if (c <= 77) return "Snow"; if (c <= 82) return "Rain"; if (c <= 86) return "Snow";
    if (c <= 99) return "Thunderstorm"; return "—";
  }
  function weatherIcon(c) {
    if (c == null) return "cloud";
    if (c === 0) return "clear_day"; if (c <= 2) return "partly_cloudy_day"; if (c === 3) return "cloud";
    if (c <= 48) return "foggy"; if (c <= 67) return "rainy"; if (c <= 77) return "weather_snowy";
    if (c <= 82) return "rainy"; if (c <= 86) return "weather_snowy"; if (c <= 99) return "thunderstorm";
    return "cloud";
  }
  function hourLabel(iso, i) {
    if (i === 0) return "Now";
    var h = parseInt(iso.slice(11, 13), 10);
    var ap = h >= 12 ? "PM" : "AM"; var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + " " + ap;
  }
  function loadSysInfo() {
    var box = $("#sysinfo"); if (!box) return;
    var ua = navigator.userAgent;
    var device = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android"
      : /Macintosh/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows PC" : /Linux/.test(ua) ? "Linux" : "Unknown";
    var devIcon = /iPhone|Android|iPad/.test(ua) ? "smartphone" : /Macintosh/.test(ua) ? "laptop_mac" : "computer";
    var conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection || {};
    var connLabel = conn.type === "cellular" ? "Cellular" : conn.type === "wifi" ? "Wi-Fi"
      : conn.effectiveType ? conn.effectiveType.toUpperCase() : "Wi-Fi";
    var connIcon = conn.type === "cellular" ? "signal_cellular_alt" : "wifi";

    var s = { loc: "Locating…", isp: "…", temp: null, cond: "—", code: null, hi: null, lo: null, hours: [] };
    function render() {
      var hoursHTML = s.hours.map(function (h) {
        return '<div class="wx-hour"><span class="h-t">' + esc(h.t) + '</span>' +
          '<span class="material-symbols-outlined">' + weatherIcon(h.c) + '</span>' +
          '<span class="h-d">' + (h.d != null ? h.d + "°" : "—") + "</span></div>";
      }).join("");
      var hl = (s.hi != null) ? 'H:' + s.hi + '°  L:' + s.lo + '°' : "";
      box.innerHTML =
        '<div class="wx-card">' +
          '<div class="wx-head">' +
            '<div class="wx-loc">' + esc(s.loc) + '</div>' +
            '<div class="wx-cond"><div>' + esc(s.cond) + '</div><div class="wx-hl">' + hl + '</div></div>' +
          '</div>' +
          '<div class="wx-temp">' + (s.temp != null ? s.temp + "°" : "—") + '</div>' +
          (hoursHTML ? '<div class="wx-hours">' + hoursHTML + '</div>' : '') +
        '</div>' +
        '<div class="si-list">' +
          '<div class="si-item"><span class="material-symbols-outlined">router</span><span class="si-v">' + esc(s.isp) + '</span></div>' +
          '<div class="si-item"><span class="material-symbols-outlined">' + devIcon + '</span><span class="si-v">' + esc(device) + '</span></div>' +
        '</div>';
    }
    render();
    fetch("https://ipwho.is/").then(function (r) { return r.json(); }).then(function (d) {
      if (!d || d.success === false) return;
      s.loc = d.city || d.region || d.country || "—";
      s.isp = (d.connection && (d.connection.isp || d.connection.org)) || "—";
      render();
      if (d.latitude == null || d.longitude == null) return;
      var u = "https://api.open-meteo.com/v1/forecast?latitude=" + d.latitude + "&longitude=" + d.longitude +
        "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min" +
        "&hourly=temperature_2m,weather_code&forecast_days=2&timezone=auto";
      fetch(u).then(function (r) { return r.json(); }).then(function (wd) {
        if (!wd) return;
        if (wd.current) { s.temp = Math.round(wd.current.temperature_2m); s.code = wd.current.weather_code; s.cond = weatherText(s.code); }
        if (wd.daily) { s.hi = Math.round(wd.daily.temperature_2m_max[0]); s.lo = Math.round(wd.daily.temperature_2m_min[0]); }
        if (wd.hourly && wd.current) {
          // current.time carries minutes (…T07:30); hourly is on the hour (…T07:00) — match the hour prefix
          var curHour = wd.current.time.slice(0, 13);
          var start = -1;
          for (var k = 0; k < wd.hourly.time.length; k++) { if (wd.hourly.time[k].slice(0, 13) === curHour) { start = k; break; } }
          if (start < 0) start = 0;
          s.hours = [];
          for (var i = 0; i < 6 && start + i < wd.hourly.time.length; i++) {
            var idx = start + i;
            s.hours.push({ t: hourLabel(wd.hourly.time[idx], i), c: wd.hourly.weather_code[idx], d: Math.round(wd.hourly.temperature_2m[idx]) });
          }
        }
        render();
      }).catch(function () {});
    }).catch(function () {});
  }

  // letter-glitch wallpaper (same vibe as the home hero), started lazily
  var wpStarted = false;
  function startWallpaper() {
    if (wpStarted) return; wpStarted = true;
    var canvas = $("#wallpaper"), ctx = canvas.getContext("2d");
    var CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&";
    var FS = 14, COLORS = ["#79b0ff", "#ea73fb", "#ffac54"], cols, rows, grid;
    function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
    function resize() {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      cols = Math.ceil(canvas.width / FS); rows = Math.ceil(canvas.height / FS); grid = [];
      for (var r = 0; r < rows; r++) { var row = []; for (var c = 0; c < cols; c++) row.push({ ch: rnd(CHARS), color: rnd(COLORS), op: Math.random() * 0.5 + 0.1 }); grid.push(row); }
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.font = FS + "px monospace";
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) { var x = grid[r][c]; ctx.globalAlpha = x.op; ctx.fillStyle = x.color; ctx.fillText(x.ch, c * FS, (r + 1) * FS); }
      ctx.globalAlpha = 1;
    }
    function glitch() {
      var n = Math.floor(cols * rows * 0.03);
      for (var i = 0; i < n; i++) { var r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * cols); var x = grid[r][c]; x.ch = rnd(CHARS); x.color = rnd(COLORS); x.op = Math.random() * 0.5 + 0.1; }
      draw();
    }
    resize(); draw(); window.addEventListener("resize", function () { resize(); draw(); }); setInterval(glitch, 50);
  }

})();
</script>
