{{- $bp := (urls.Parse site.BaseURL).Path | strings.TrimSuffix "/" -}}
<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="color-scheme" content="dark"/>
  <title>nadec@fabacademy:~$ // terminal</title>
  <meta name="description" content="Terminal interface for Nadec Biju's Fab Academy portfolio. Type `help` to begin."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <link rel="icon" type="image/png" href="{{ $bp }}/favicon.png"/>

  <style>
    /* ══════════════ Base / reset ══════════════ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    :root {
      --bg:        #0a0a0a;
      --bg-soft:   #101010;
      --fg:        #d4d4d4;
      --dim:       #6a6a6a;
      --green:     #4ade80;
      --blue:      #79b0ff;
      --purple:    #ea73fb;
      --orange:    #ffac54;
      --red:       #ff716c;
      --cyan:      #5eead4;
      --line:      #2a2a2a;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle; line-height: 1;
    }
    ::selection { background: rgba(121,176,255,0.30); color: #fff; }

    /* slim scrollbars everywhere inside the terminal */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #2f2f2f; border-radius: 6px; border: 2px solid var(--bg); }
    *::-webkit-scrollbar-thumb:hover { background: #444; }

    /* ══════════════ Markdown (mirrors the site's .prose-neon) ══════════════ */
    .prose-neon { color: #adaaaa; line-height: 1.75; font-family: Inter, sans-serif; }
    .prose-neon h1, .prose-neon h2, .prose-neon h3, .prose-neon h4, .prose-neon h5 {
      font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; color: #fff;
      letter-spacing: -0.02em; margin: 2rem 0 0.75rem;
    }
    .prose-neon h1 { font-size: 1.9rem; margin-top: 0; }
    .prose-neon h2 { font-size: 1.45rem; margin-top: 1.5rem; }
    .prose-neon h3 { font-size: 1.2rem; }
    .prose-neon h4 { font-size: 1.02rem; }
    .prose-neon p  { margin-bottom: 1rem; }
    .prose-neon a  { color: #79b0ff; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .prose-neon a:hover { color: #5da2ff; }
    .prose-neon strong { color: #fff; font-weight: 600; }
    .prose-neon em { color: #c0c0c0; }
    .prose-neon code {
      font-family: var(--mono); background: #131313; color: #79b0ff;
      padding: 0.15em 0.45em; border-radius: 0.25rem; font-size: 0.875em; border: 1px solid #484847;
    }
    .prose-neon pre {
      background: #000; border: 1px solid #484847; border-radius: 0.5rem;
      padding: 1.1rem; overflow-x: auto; margin: 1.25rem 0;
    }
    .prose-neon pre code { background: none; border: none; padding: 0; color: #adaaaa; font-size: 0.85rem; }
    .prose-neon ul { padding-left: 0; margin-bottom: 1rem; }
    .prose-neon ul li { color: #adaaaa; padding: 0.2rem 0 0.2rem 1.25rem; position: relative; list-style: none; }
    .prose-neon ul li::before { content: "—"; color: #79b0ff; position: absolute; left: 0; font-weight: 700; }
    .prose-neon ol { padding-left: 0; margin-bottom: 1rem; counter-reset: ol-counter; }
    .prose-neon ol li { color: #adaaaa; padding: 0.2rem 0 0.2rem 1.75rem; position: relative; list-style: none; counter-increment: ol-counter; }
    .prose-neon ol li::before { content: counter(ol-counter) "."; color: #79b0ff; position: absolute; left: 0; font-weight: 700; }
    .prose-neon img { max-width: 100%; height: auto; border-radius: 0.6rem; margin: 1.25rem 0; border: 1px solid #484847; }
    .prose-neon blockquote {
      border-left: 4px solid #ffac54; padding: 0.85rem 1.25rem; margin: 1.5rem 0;
      background: linear-gradient(90deg, rgba(255,172,84,0.12), rgba(255,172,84,0.03));
      border-radius: 0 0.5rem 0.5rem 0; color: #f0f0f0; font-weight: 500;
    }
    .prose-neon blockquote p:last-child { margin-bottom: 0; }
    .prose-neon table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; border-radius: 0.5rem; overflow: hidden; }
    .prose-neon table th { background: #20201f; color: #fff; padding: 0.6rem 0.9rem; text-align: left; font-family: "Plus Jakarta Sans", sans-serif; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .prose-neon table td { padding: 0.6rem 0.9rem; color: #adaaaa; border-bottom: 1px solid #262626; }
    .prose-neon table tr:last-child td { border-bottom: none; }
    .prose-neon hr { border: none; border-top: 1px solid #484847; margin: 1.75rem 0; }
    .prose-neon video, .prose-neon iframe { max-width: 100%; border-radius: 0.6rem; margin: 1.25rem 0; border: 1px solid #484847; }
    .prose-neon details { margin: 0.75rem 0; border: 1px solid #3a3a3a; border-radius: 0.6rem; background: #131313; overflow: hidden; }
    .prose-neon summary { cursor: pointer; padding: 0.8rem 1rem; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; color: #79b0ff; }
    .prose-neon details > *:not(summary) { margin-left: 1rem; margin-right: 1rem; }
    /* heading permalink anchors: hidden until hover for a cleaner reader */
    .prose-neon .anchor { opacity: 0; margin-left: 0.45rem; text-decoration: none; font-weight: 400; transition: opacity 0.15s; }
    .prose-neon h1:hover .anchor, .prose-neon h2:hover .anchor, .prose-neon h3:hover .anchor,
    .prose-neon h4:hover .anchor, .prose-neon h5:hover .anchor { opacity: 0.45; }
  </style>
</head>
<body>
  <script>window.NB_BP = "{{ $bp }}";</script>
  {{- block "main" . }}{{ end -}}
</body>
</html>
