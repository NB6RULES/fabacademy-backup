baseURL = 'https://fabacademy.org/2026/labs/kochi/students/nadec-biju/'
languageCode = 'en-us'
title = 'Nadec Biju | Fab Academy 2026 Portfolio'
enableGitInfo = true

# Emit a robots.txt (rendered from layouts/robots.txt) so crawlers find the sitemap.
enableRobotsTXT = true

# No taxonomies are used on this site, so drop the empty categories/tags pages
# entirely — keeps them out of the build and the sitemap.
disableKinds = ['taxonomy', 'term']

# Never publish real credentials / project config, even though they sit in static/files/.
ignoreFiles = ['cloud_secrets\.h$', 'google-services\.json$', 'firebase_options\.dart$', '\.firebaserc$']

# ignoreFiles alone doesn't cover the static mount, so this is the part that actually
# keeps these out of public/. Patterns are globs (** spans directories).
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    excludeFiles = [
      "**/cloud_secrets.h",
      "**/google-services.json",
      "**/firebase_options.dart",
      "**/.firebaserc",
    ]

[params]
  description = "Nadec Biju's Fab Academy 2026 portfolio — digital fabrication, electronics, programming, and final project documentation from Fab Lab Kochi."
  # ── MASTER SWITCH ──────────────────────────────────────────────────────────
  # true  → the terminal/OS is the default home: anyone landing on the site is
  #         sent to /terminal/ (they can still hit "Exit to site" to browse normally).
  # false → the normal Hugo site is the default home; only people who opt into
  #         "dev mode" land in the terminal.
  # Flip this one value and push to swap which experience is the front door.
  terminalAsHome = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
